name: Build Custom Minimal MPV AAR

on:
  workflow_dispatch:

jobs:
  build-aar:
    name: Build Minimal AAR (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      # 1. سحب مستودعك الخاص
      - name: Checkout Your Custom Repository
        uses: actions/checkout@v4
        with:
          path: user-repo

      # 2. سحب سورس mpv-android الرسمي
      - name: Checkout mpv-android Upstream
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          submodules: recursive
          fetch-depth: 1
          path: mpv-core

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            gperf \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-jinja2 \
            wget \
            unzip

          # ترقية Meson لأحدث إصدار
          sudo pip3 install --break-system-packages --upgrade meson ninja

      - name: Setup Android SDK & NDK r27c
        run: |
          set -euo pipefail
          cd mpv-core/buildscripts

          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux

          if [ ! -d "sdk/android-ndk-r27c" ]; then
            echo "==> Downloading NDK r27c..."
            wget -q --progress=bar:force "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Inject Custom Scripts & Build Dependencies
        run: |
          set -euo pipefail

          USER_DIR="$GITHUB_WORKSPACE/user-repo"
          CORE_DIR="$GITHUB_WORKSPACE/mpv-core/buildscripts"

          echo "==> Syncing scripts into buildscripts/scripts/..."
          # نسخ الملفات الأربعة إلى مسار scripts في mpv-core
          mkdir -p "$CORE_DIR/scripts"
          find "$USER_DIR" -type f \( -name "buildall.sh" -o -name "buildall" -o -name "build_minimal_ffmpeg.sh" -o -name "build_mpv.sh" -o -name "mpv.map" \) -exec cp -v {} "$CORE_DIR/scripts/" \;

          # توحيد الاسم إلى buildall.sh ومنح الصلاحيات
          if [ -f "$CORE_DIR/scripts/buildall" ]; then
            mv -v "$CORE_DIR/scripts/buildall" "$CORE_DIR/scripts/buildall.sh"
          fi
          chmod +x "$CORE_DIR"/scripts/*.sh "$CORE_DIR"/*.sh 2>/dev/null || true

          # تنزيل الاعتماديات الرسمية أولاً
          cd "$CORE_DIR"
          git config --global url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype.git"
          git config --global url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype"
          find . -type f \( -name "*.sh" -o -name "*.cfg" \) -exec sed -i 's|https://gitlab.freedesktop.org/freetype/freetype.git|https://github.com/freetype/freetype.git|g' {} + 2>/dev/null || true

          ./download.sh
          find deps/ -name "meson.build" -exec sed -i "s/meson_version : '>= [0-9.]*'/meson_version : '>= 0.60.0'/g" {} + 2>/dev/null || true

          # تشغيل buildall.sh من داخل مجلد scripts لضمان مطابقة SCRIPT_DIR
          echo "==> Running custom buildall.sh from scripts/..."
          cd "$CORE_DIR/scripts"
          ./buildall.sh

      - name: Assemble Release AAR
        run: |
          set -euo pipefail
          cd mpv-core

          # 1. تحويل الموديول إلى Library وحذف خصائص التطبيق
          python3 - << 'EOF'
          import re

          def remove_block(text, block_name):
              match = re.search(r'\b' + block_name + r'\b[^{]*\{', text)
              if not match:
                  return text
              start = match.end() - 1
              idx = match.start()
              depth = 1
              i = start + 1
              while i < len(text) and depth > 0:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                  i += 1
              return text[:idx] + text[i:]

          gradle_file = 'app/build.gradle'
          with open(gradle_file, 'r') as f:
              content = f.read()

          content = content.replace("com.android.application", "com.android.library")
          content = re.sub(r'applicationId\s+.*', '', content)
          content = re.sub(r'shrinkResources\s+.*', '', content)
          content = re.sub(r'signingConfig\s+.*', '', content)

          for block in ['androidComponents', 'applicationVariants', 'signingConfigs', 'splits', 'bundle']:
              while re.search(r'\b' + block + r'\b[^{]*\{', content):
                  content = remove_block(content, block)

          custom_config = '''
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }
              }
              defaultConfig {
                  buildConfigField "String", "VERSION_NAME", "\\"1.0.0\\""
                  buildConfigField "int", "VERSION_CODE", "1"
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }
          '''
          content = re.sub(r'(android\s*\{)', r'\1' + custom_config, content, count=1)

          with open(gradle_file, 'w') as f:
              f.write(content)

          manifest_file = 'app/src/main/AndroidManifest.xml'
          with open(manifest_file, 'r') as f:
              manifest = f.read()

          manifest = manifest.replace('<category android:name="android.intent.category.LAUNCHER" />', '')
          manifest = manifest.replace('<category android:name="android.intent.category.LAUNCHER"/>', '')
          manifest = re.sub(r'android:icon="[^"]*"', '', manifest)
          manifest = re.sub(r'android:roundIcon="[^"]*"', '', manifest)
          manifest = re.sub(r'android:label="[^"]*"', '', manifest)
          manifest = re.sub(r'android:theme="[^"]*"', '', manifest)

          with open(manifest_file, 'w') as f:
              f.write(manifest)
          EOF

          # 2. تعديل AboutActivity.kt
          ABOUT_FILE=$(find app/src/main/ -name "AboutActivity.kt" | head -n 1)
          if [ -n "$ABOUT_FILE" ] && [ -f "$ABOUT_FILE" ]; then
            sed -i '/import.*VERSION_NAME/d' "$ABOUT_FILE"
            sed -i '/import.*VERSION_CODE/d' "$ABOUT_FILE"
            sed -i 's/BuildConfig\.VERSION_NAME/"1.0.0"/g' "$ABOUT_FILE"
            sed -i 's/BuildConfig\.VERSION_CODE/1/g' "$ABOUT_FILE"
            sed -i 's/\bVERSION_NAME\b/"1.0.0"/g' "$ABOUT_FILE"
            sed -i 's/\bVERSION_CODE\b/1/g' "$ABOUT_FILE"
          fi

          # 3. جلب ملفات .so الصافية الناتجة من البناء
          rm -rf app/src/main/jniLibs app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a

          echo "==> Searching for built libmpv.so..."
          # البحث في prefix وفك الروابط الرمزية لحزم الملف الحقيقي
          find buildscripts/ -type f -name "libmpv.so*" -exec cp -v -aL {} app/src/main/jniLibs/arm64-v8a/libmpv.so \;
          find buildscripts/ -type f -name "libplayer.so" -exec cp -v -aL {} app/src/main/jniLibs/arm64-v8a/libplayer.so \; 2>/dev/null || true

          # تجريد نهائي للرموز
          find app/src/main/jniLibs/arm64-v8a/ -name "*.so" -exec "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all -R .comment -R .note {} + 2>/dev/null || true

          echo "==> Packaged native libraries:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

          # 4. بناء الـ AAR عبر Gradle
          chmod +x gradlew
          ./gradlew :app:assembleDefaultRelease -x lint -x test --no-daemon

          # 5. استخراج الـ AAR والتحقق من احتوائه على المكتبة
          mkdir -p ../dist
          find app/build/outputs/aar/ -type f -name "*.aar" -exec cp -v {} ../dist/mpv-android.aar \;

          echo "==> Verifying AAR Contents:"
          unzip -l ../dist/mpv-android.aar | grep -E '\.so$'

          echo "==> Final Minimal AAR Size:"
          ls -lh ../dist/
      - name: Upload Minimal MPV AAR
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-minimal-aar
          path: dist/mpv-android.aar
          if-no-files-found: error
