name: Build MPV Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3

      - name: Setup and Download Dependencies
        run: |
          set -euo pipefail
          RUNNER_SDK="$ANDROID_SDK_ROOT"
          cd buildscripts
          chmod +x buildall.sh include/*.sh

          mkdir -p sdk
          ln -sfn "$RUNNER_SDK" sdk/android-sdk-linux

          export WGET="wget --progress=bar:force"
          export IN_CI=1

          mkdir -p sdk/bin
          if [ ! -f sdk/bin/gas-preprocessor.pl ]; then
            wget -q https://github.com/FFmpeg/gas-preprocessor/raw/master/gas-preprocessor.pl -O sdk/bin/gas-preprocessor.pl
            chmod +x sdk/bin/gas-preprocessor.pl
          fi

          if [ ! -d "sdk/android-ndk-r30" ]; then
            echo "==> Downloading NDK r30"
            $WGET "http://dl.google.com/android/repository/android-ndk-r30-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          ./include/download-deps.sh

      - name: Build MPV Arm64
        run: |
          set -euo pipefail
          cd buildscripts
          ./buildall.sh --only-deps mpv --arch arm64
          ./buildall.sh -n mpv --arch arm64
          ./buildall.sh -n --arch arm64

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64
          path: |
            app/src/main/libs/arm64-v8a/*.so
            buildscripts/prefix/arm64/lib/libmpv.so
          if-no-files-found: warn
