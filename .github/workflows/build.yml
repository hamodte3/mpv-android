name: Build MPV Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3

      - name: Setup Environment & Toolchain
        run: |
          set -euo pipefail
          RUNNER_SDK="$ANDROID_SDK_ROOT"
          cd buildscripts
          chmod +x *.sh include/*.sh 2>/dev/null || true
          [ -f buildall ] && chmod +x buildall

          # إعداد مجلدات الـ SDK
          mkdir -p sdk
          ln -sfn "$RUNNER_SDK" sdk/android-sdk-linux

          # أداة gas-preprocessor
          mkdir -p sdk/bin
          if [ ! -f sdk/bin/gas-preprocessor.pl ]; then
            wget -q https://github.com/FFmpeg/gas-preprocessor/raw/master/gas-preprocessor.pl -O sdk/bin/gas-preprocessor.pl
            chmod +x sdk/bin/gas-preprocessor.pl
          fi

          # تثبيت NDK r30
          if [ ! -d "sdk/android-ndk-r30" ]; then
            echo "==> Downloading NDK r30"
            wget -q --progress=bar:force "http://dl.google.com/android/repository/android-ndk-r30-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          # تنزيل سورس mpv والاعتماديات في مسار deps
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          mkdir -p deps
          cd deps

          if [ ! -d mbedtls ]; then
            echo "==> Fetching mbedtls"
            wget -qO- https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2 | tar -xj -C .
            mv mbedtls-3.6.7 mbedtls
          fi

          if [ ! -d ffmpeg ]; then
            echo "==> Cloning ffmpeg"
            git clone --depth 1 -b n9.0 https://github.com/FFmpeg/FFmpeg ffmpeg
          fi

          if [ ! -d libplacebo ]; then
            echo "==> Cloning libplacebo"
            git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git libplacebo
          fi

          if [ ! -d curl ]; then
            echo "==> Fetching curl"
            wget -qO- https://curl.se/download/curl-8.21.0.tar.xz | tar -xJ -C .
            mv curl-8.21.0 curl
          fi

      - name: Compile MPV & FFmpeg Arm64
        run: |
          set -euo pipefail
          cd buildscripts
          chmod +x buildall* *.sh 2>/dev/null || true

          # تشغيل السكربت المباشر سواء كان بامتداد sh أو بدونه ودون وسائط معطلة
          if [ -f "buildall" ]; then
            echo "==> Executing ./buildall"
            bash ./buildall
          elif [ -f "buildall.sh" ]; then
            echo "==> Executing ./buildall.sh"
            bash ./buildall.sh
          else
            echo "==> Running sub-scripts directly"
            bash ./build_minimal_ffmpeg.sh
            bash ./build_mpv.sh
          fi

      - name: Collect Libraries
        run: |
          mkdir -p dist

          # سحب جميع ملفات so من مسار prefix ومجلدات المشروع
          find buildscripts/ -type f -name "*.so*" -exec cp -v {} dist/ \; 2>/dev/null || true
          find app/ -type f -name "*.so" -exec cp -v {} dist/ \; 2>/dev/null || true

          echo "==> Collected Libraries in dist:"
          ls -lh dist/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64
          path: dist/
          if-no-files-found: error
