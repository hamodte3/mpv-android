name: Build MPV Android AAR

on:
  workflow_dispatch:

jobs:
  build-aar:
    name: Build MPV AAR (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mpv-android Repository
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-jinja2 \
            wget \
            unzip

          # ترقية Meson لأحدث إصدار من PyPI لتجاوز قيود حزم Ubuntu القديمة
          sudo pip3 install --break-system-packages --upgrade meson ninja

      - name: Setup Android SDK & NDK r27c
        run: |
          set -euo pipefail
          cd buildscripts

          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux

          if [ ! -d "sdk/android-ndk-r27c" ]; then
            echo "==> Downloading NDK r27c..."
            wget -q --progress=bar:force "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download & Build Dependencies
        run: |
          set -euo pipefail
          cd buildscripts

          # 1. تنزيل الاعتماديات
          ./download.sh

          # 2. إزالة قيود إصدار Meson الصارمة من ملفات البناء (تجاوز خطأ fontconfig وغيره)
          find deps/ -name "meson.build" -exec sed -i "s/meson_version : '>= [0-9.]*'/meson_version : '>= 0.60.0'/g" {} + 2>/dev/null || true

          # 3. فرض التحسين ومحاذاة 16KB
          export EXTRA_CFLAGS="-Os -flto -ffunction-sections -fdata-sections"
          export EXTRA_LDFLAGS="-Wl,--gc-sections -flto -Wl,-z,max-page-size=16384 -static-libstdc++"

          # 4. بناء مكتبات الـ native لمعمارية arm64
          ./buildall.sh --arch arm64

          # 5. تجريد الرموز الزائدة لتقليل الحجم لأقصى درجة
          find prefix/arm64/ -name "*.so" -exec llvm-strip --strip-unneeded -R .comment {} + 2>/dev/null || true

      - name: Assemble Release AAR
        run: |
          set -euo pipefail

          # 1. تحويل الموديول إلى Library وحذف الإعدادات الخاصة بالتطبيقات فقط
          for f in app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/com\.android\.application/com.android.library/g' "$f"
              sed -i '/applicationId/d' "$f"
              sed -i '/shrinkResources/d' "$f"
              sed -i '/signingConfig/d' "$f"
            fi
          done

          # 2. تنظيف الـ Manifest لمنع تعارضات الخصائص
          sed -i '/android:icon=/d' app/src/main/AndroidManifest.xml || true
          sed -i '/android:roundIcon=/d' app/src/main/AndroidManifest.xml || true
          sed -i '/android:label=/d' app/src/main/AndroidManifest.xml || true
          sed -i '/android:theme=/d' app/src/main/AndroidManifest.xml || true

          # 3. بناء ملف الـ AAR
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon

          # 4. نسخ ملف الـ AAR الناتج إلى مجلد dist
          mkdir -p dist
          find app/build/outputs/aar/ -type f -name "*.aar" -exec cp -v {} dist/mpv-android.aar \;

          echo "==> Final Generated AAR:"
          ls -lh dist/
      - name: Upload MPV AAR
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-aar
          path: dist/mpv-android.aar
          if-no-files-found: error
