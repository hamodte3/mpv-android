name: Build Ultra-Lean MPV-Android (arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build:
    name: Build Arm64 Ultra-Lean
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-pip

      - name: Setup Android SDK & NDK Environment
        run: |
          # العثور على أحدث NDK مثبت في بيئة GitHub Runner الافتراضية
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Make Scripts Executable
        run: |
          chmod +x buildscripts/buildall.sh
          chmod +x buildscripts/include/*.sh

      - name: Fetch SDK & Dependencies (CI Install)
        run: |
          ./buildscripts/include/ci.sh install

      - name: Build MPV & Native Libraries (arm64-v8a)
        run: |
          # تشغيل البناء لمعمارية 64-bit حصراً
          ./buildscripts/include/ci.sh build

      - name: Upload arm64-v8a Shared Libraries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64-v8a-binaries
          path: |
            app/src/main/libs/arm64-v8a/*.so
            buildscripts/prefix/arm64/lib/libmpv.so
          if-no-files-found: warn

      - name: Upload Output APK (If Built)
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-lean-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
