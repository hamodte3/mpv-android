name: Build MPV Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3

      - name: Setup Environment & Toolchain
        run: |
          set -euo pipefail
          RUNNER_SDK="$ANDROID_SDK_ROOT"
          cd buildscripts
          chmod +x *.sh include/*.sh 2>/dev/null || true

          # 1. إعداد مسار SDK
          mkdir -p sdk
          ln -sfn "$RUNNER_SDK" sdk/android-sdk-linux

          # 2. أداة gas-preprocessor
          mkdir -p sdk/bin
          if [ ! -f sdk/bin/gas-preprocessor.pl ]; then
            wget -q https://github.com/FFmpeg/gas-preprocessor/raw/master/gas-preprocessor.pl -O sdk/bin/gas-preprocessor.pl
            chmod +x sdk/bin/gas-preprocessor.pl
          fi

          # 3. تثبيت NDK r30 وضبط المسار
          if [ ! -d "sdk/android-ndk-r30" ]; then
            echo "==> Downloading NDK r30..."
            wget -q --progress=bar:force "http://dl.google.com/android/repository/android-ndk-r30-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

          # 4. تنزيل سورس mpv والاعتماديات
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          mkdir -p deps
          cd deps

          if [ ! -d mbedtls ]; then
            echo "==> Fetching mbedtls..."
            wget -qO- https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2 | tar -xj -C .
            mv mbedtls-3.6.7 mbedtls
          fi

          if [ ! -d ffmpeg ]; then
            echo "==> Cloning ffmpeg..."
            git clone --depth 1 -b n9.0 https://github.com/FFmpeg/FFmpeg ffmpeg
          fi

          if [ ! -d libplacebo ]; then
            echo "==> Cloning libplacebo..."
            git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git libplacebo
          fi

          if [ ! -d curl ]; then
            echo "==> Fetching curl..."
            wget -qO- https://curl.se/download/curl-8.21.0.tar.xz | tar -xJ -C .
            mv curl-8.21.0 curl
          fi

      - name: Compile MPV & FFmpeg Arm64
        run: |
          set -euo pipefail
          cd buildscripts

          # تنظيف البناء السابق
          rm -rf build prefix
          mkdir -p build prefix

          # إنشاء سكربت بناء FFmpeg مباشرة داخل المجلد بالمسارات المضبوطة
          cat << 'EOF' > build_minimal_ffmpeg.sh
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/ffmpeg"
          FFMPEG_SRC="${SCRIPT_DIR}/deps/ffmpeg"

          mkdir -p "${BUILD_DIR}" "${PREFIX}"
          cd "${BUILD_DIR}"

          SAFE_CFLAGS="${EXTRA_CFLAGS:-} -I${PREFIX}/include -fvisibility=default"

          FFMPEG_MINIMAL_FLAGS=(
            --target-os=android
            --arch=aarch64
            --cpu=armv8-a
            --enable-cross-compile
            --cc=aarch64-linux-android24-clang
            --cxx=aarch64-linux-android24-clang++
            --ar=llvm-ar
            --ranlib=llvm-ranlib
            --nm=llvm-nm
            --strip=llvm-strip
            --prefix="${PREFIX}"
            --disable-static
            --enable-shared
            --disable-everything
            --disable-doc
            --disable-programs
            --disable-encoders
            --disable-muxers
            --disable-devices
            --disable-filters
            --disable-iconv
            --disable-bzlib
            --disable-lzma
            --disable-xlib
            --enable-swscale
            --enable-jni
            --enable-mediacodec
            --disable-hwaccels
            --enable-hwaccel=h264_mediacodec
            --enable-hwaccel=hevc_mediacodec
            --enable-hwaccel=vp9_mediacodec
            --enable-hwaccel=av1_mediacodec
            --enable-decoder=h264,hevc,vp8,vp9,mpeg4,aac,mp3
            --enable-parser=h264,hevc,av1,vp9,aac,mpegaudio
            --enable-demuxer=mov,matroska,flv,hls,dash,aac,mp3,mpegts
            --enable-protocol=file,http,https,tcp,udp,hls,tls
          )

          "${FFMPEG_SRC}/configure" "${FFMPEG_MINIMAL_FLAGS[@]}" \
            --extra-cflags="${SAFE_CFLAGS}" \
            --extra-ldflags="${EXTRA_LDFLAGS:-} -L${PREFIX}/lib"

          make -j$(nproc)
          make install
          EOF

          # إنشاء سكربت بناء MPV مباشرة داخل المجلد
          cat << 'EOF' > build_mpv.sh
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/mpv"
          CROSS_FILE="${BUILD_DIR}/android_cross.txt"
          MPV_SRC="${SCRIPT_DIR}/deps/mpv"

          mkdir -p "${BUILD_DIR}" "${PREFIX}"

          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"

          NDK_LLVM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET="aarch64-linux-android24"

          cat << CROSS_EOF > "${CROSS_FILE}"
          [binaries]
          c = '${NDK_LLVM}/${TARGET}-clang'
          cpp = '${NDK_LLVM}/${TARGET}-clang++'
          ar = '${NDK_LLVM}/llvm-ar'
          strip = '${NDK_LLVM}/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = ['-Os', '-flto', '-fvisibility=hidden', '-I${PREFIX}/include']
          c_link_args = ['-Wl,--gc-sections', '-Wl,-s', '-flto', '-Wl,--icf=all', '-L${PREFIX}/lib']
          CROSS_EOF

          MESON_ARGS=(
            "--cross-file=${CROSS_FILE}"
            "--prefix=${PREFIX}"
            "--buildtype=release"
            "--default-library=shared"
            "-Doptimization=s"
            "-Db_lto=true"
            "-Dlibass=disabled"
            "-Dcplayer=false"
            "-Degl-android=enabled"
            "-Dlcms2=disabled"
            "-Drubberband=disabled"
            "-Dfontconfig=disabled"
            "-Dexpat=disabled"
            "-Dlua=disabled"
            "-Djavascript=disabled"
            "-Dlibsmbclient=disabled"
            "-Duchardet=disabled"
            "-Dcdda=disabled"
            "-Ddvbin=disabled"
            "-Ddvdnav=disabled"
            "-Ddvdread=disabled"
            "-Dmanpage-build=disabled"
            "-Dhtml-build=disabled"
            "-Dtests=disabled"
            "-Ddocs=disabled"
          )

          echo "==> Configuring Minimal MPV with Meson..."
          meson setup "${BUILD_DIR}" "${MPV_SRC}" "${MESON_ARGS[@]}" --wipe || meson setup "${BUILD_DIR}" "${MPV_SRC}" "${MESON_ARGS[@]}"

          echo "==> Compiling libmpv with Ninja..."
          ninja -C "${BUILD_DIR}" -j$(nproc)

          echo "==> Installing to prefix..."
          ninja -C "${BUILD_DIR}" install

          echo "==> MPV Build Complete! libmpv.so is ready in: ${PREFIX}/lib"
          EOF

          chmod +x build_minimal_ffmpeg.sh build_mpv.sh

          export EXTRA_CFLAGS="-Os -flto -fvisibility=hidden -ffunction-sections -fdata-sections -fmerge-all-constants"
          export EXTRA_LDFLAGS="-Wl,--gc-sections -Wl,-s -flto -Wl,--icf=all -Wl,--pack-dyn-relocs=android+relr -Wl,--exclude-libs,ALL -Wl,-Bsymbolic-functions -Wl,--hash-style=gnu -Wl,-z,max-page-size=16384"

          echo "==> [1/3] Building Minimal FFmpeg..."
          bash ./build_minimal_ffmpeg.sh

          echo "==> [2/3] Building Ultra-Minimal MPV..."
          bash ./build_mpv.sh

          echo "==> [3/3] Stripping SO files..."
          if command -v llvm-strip &> /dev/null; then
            find prefix/ -name "*.so" -exec llvm-strip --strip-debug --strip-unneeded -R .comment {} + 2>/dev/null || true
          fi

      - name: Collect Libraries
        run: |
          mkdir -p dist

          # سحب ملفات SO الناتجة عن البناء الفعلي فقط من prefix والمشروع
          find buildscripts/prefix/ -type f -name "*.so*" -exec cp -v {} dist/ \; 2>/dev/null || true
          find app/ -type f -name "*.so*" -exec cp -v {} dist/ \; 2>/dev/null || true

          echo "==> Final arm64-v8a Binaries:"
          ls -lh dist/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64
          path: dist/
          if-no-files-found: error
