- name: Setup & Download Dependencies
        run: |
          set -euo pipefail
          cd buildscripts
          
          # ربط SDK
          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux
          
          # تحميل NDK إذا لم يكن موجوداً
          IN_CI=1 ./include/download-sdk.sh
          
          # تحميل mpv سورس كود
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1
          
          # تحميل الاعتماديات المصفاة
          IN_CI=1 ./include/download-deps.sh

      - name: Build MPV (arm64-v8a)
        run: |
          set -euo pipefail
          cd buildscripts
          
          # بناء الاعتماديات أولاً لـ arm64
          ./buildall.sh --only-deps mpv --arch arm64
          
          # بناء mpv
          ./buildall.sh -n mpv --arch arm64
          
          # بناء تطبيق أندرويد و libplayer.so
          ./buildall.sh -n --arch arm64
