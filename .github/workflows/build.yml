- name: Setup and Download Dependencies
        run: |
          set -euo pipefail
          cd buildscripts
          chmod +x buildall.sh include/*.sh

          # ربط SDK الجاهز في السيرفر
          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux

          # ربط أحدث NDK متوفر في نظام السيرفر بدلاً من تشغيل download-sdk.sh
          SYSTEM_NDK=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
          ln -sfn "$SYSTEM_NDK" sdk/android-ndk

          # تحميل كود MPV المصدري
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          # تحميل الاعتماديات المصفاة
          export IN_CI=1
          ./include/download-deps.sh
