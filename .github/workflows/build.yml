name: Build MPV Android AAR

on:
  workflow_dispatch:

jobs:
  build-aar:
    name: Build MPV AAR (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mpv-android Repository
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-jinja2 \
            wget \
            unzip

      - name: Setup Android SDK & NDK r27c
        run: |
          set -euo pipefail
          cd buildscripts

          # ربط SDK
          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux

          # تنزيل NDK r27c (الإصدار الأكثر استقراراً ورسمياً مع سكريبتات mpv-android ويدعم 16KB)
          if [ ! -d "sdk/android-ndk-r27c" ]; then
            echo "==> Downloading NDK r27c..."
            wget -q --progress=bar:force "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download & Build Dependencies
        run: |
          set -euo pipefail
          cd buildscripts

          # تنزيل جميع السورسات الرسمية
          ./download.sh

          # فرض محاذاة 16KB والربط الساكن لـ C++
          export EXTRA_CFLAGS="-Os -flto -ffunction-sections -fdata-sections"
          export EXTRA_LDFLAGS="-Wl,--gc-sections -flto -Wl,-z,max-page-size=16384 -static-libstdc++"

          # بناء جميع الاعتماديات لـ arm64-v8a فقط
          ./buildall.sh --arch arm64

      - name: Assemble Release AAR
        run: |
          set -euo pipefail

          # بناء مكتبة الـ AAR عبر Gradle
          chmod +x gradlew
          ./gradlew :mpvlib:assembleRelease --no-daemon

          # تجهيز مجلد المخرجات
          mkdir -p dist
          find mpvlib/build/outputs/aar/ -type f -name "*.aar" -exec cp -v {} dist/mpv-android.aar \;

          echo "==> AAR Built Successfully:"
          ls -lh dist/

      - name: Upload MPV AAR
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-aar
          path: dist/mpv-android.aar
          if-no-files-found: error
