name: Build Custom Minimal MPV AAR

on:
  workflow_dispatch:

jobs:
  build-aar:
    name: Build Minimal AAR (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      # 1. سحب مستودعك الخاص
      - name: Checkout Your Custom Repository
        uses: actions/checkout@v4
        with:
          path: user-repo

      # 2. سحب سورس mpv-android الرسمي
      - name: Checkout mpv-android Upstream
        uses: actions/checkout@v4
        with:
          repository: mpv-android/mpv-android
          submodules: recursive
          fetch-depth: 1
          path: mpv-core

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            gperf \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-jinja2 \
            wget \
            unzip

          sudo pip3 install --break-system-packages --upgrade meson ninja

      - name: Setup Android SDK & NDK r27c
        run: |
          set -euo pipefail
          cd mpv-core/buildscripts

          mkdir -p sdk
          ln -sfn "$ANDROID_SDK_ROOT" sdk/android-sdk-linux

          if [ ! -d "sdk/android-ndk-r27c" ]; then
            echo "==> Downloading NDK r27c..."
            wget -q --progress=bar:force "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Inject Custom Scripts & Build Dependencies
        run: |
          set -euo pipefail

          USER_DIR="$GITHUB_WORKSPACE/user-repo"
          CORE_DIR="$GITHUB_WORKSPACE/mpv-core/buildscripts"

          mkdir -p "$CORE_DIR/scripts"

          # 1. نسخ السكربتات المخصصة من مستودعك (إن وُجدت)
          find "$USER_DIR" -type f \( -name "*.sh" -o -name "mpv.map" \) -exec cp -v {} "$CORE_DIR/scripts/" \;

          # 2. ملف البيئة الموحد depinfo.sh
          cat << 'EOF' > "$CORE_DIR/scripts/depinfo.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          export API_LEVEL="24"
          export TARGET_ARCH="aarch64"
          export TARGET="aarch64-linux-android${API_LEVEL}"

          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            export NDK_LLVM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
            export PATH="${NDK_LLVM}/bin:${PATH}"
          fi
          EOF

          # 3. سكربت بناء mbedtls للتشفير وحماية HTTPS
          cat << 'EOF' > "$CORE_DIR/scripts/build_mbedtls.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          . "${SCRIPT_DIR}/depinfo.sh"

          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/mbedtls"
          SRC_DIR="${SCRIPT_DIR}/deps/mbedtls"
          [ -d "${SRC_DIR}" ] || SRC_DIR="${SCRIPT_DIR}/../deps/mbedtls"

          echo "==> Building mbedtls for HTTPS..."
          mkdir -p "${BUILD_DIR}" "${PREFIX}"

          cmake -B "${BUILD_DIR}" -S "${SRC_DIR}" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Os -flto -fPIC -Qunused-arguments"

          ninja -C "${BUILD_DIR}" install
          echo "==> mbedtls installed successfully in prefix."
          EOF

          # 4. سكربت بناء libplacebo المصغرة كـ Static Library
          cat << 'EOF' > "$CORE_DIR/scripts/build_libplacebo.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          . "${SCRIPT_DIR}/depinfo.sh"

          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/libplacebo"
          CROSS_FILE="${SCRIPT_DIR}/build/android_cross.txt"
          SRC_DIR="${SCRIPT_DIR}/deps/libplacebo"
          [ -d "${SRC_DIR}" ] || SRC_DIR="${SCRIPT_DIR}/../deps/libplacebo"

          if [ ! -d "${SRC_DIR}" ]; then
            echo "==> Cloning libplacebo..."
            git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git "${SRC_DIR}"
          fi

          echo "==> Building Minimal libplacebo (Static)..."
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}" "${PREFIX}"

          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"

          MESON_ARGS=(
            "--cross-file=${CROSS_FILE}"
            "--prefix=${PREFIX}"
            "--libdir=lib"
            "--buildtype=release"
            "--default-library=static"
            "-Db_staticpic=true"
            "-Doptimization=s"
            "-Db_lto=true"
            "-Ddemos=false"
            "-Dtests=false"
            "-Dvulkan=disabled"
            "-Dopengl=enabled"
            "-Dshaderc=disabled"
            "-Dlcms=disabled"
            "-Dd3d11=disabled"
          )

          meson setup "${BUILD_DIR}" "${SRC_DIR}" "${MESON_ARGS[@]}"
          ninja -C "${BUILD_DIR}" -j$(nproc)
          ninja -C "${BUILD_DIR}" install

          echo "==> libplacebo static build completed successfully!"
          EOF

          # 5. سكربت بناء حزمة الترجمة والخطوط (FreeType + FriBidi + HarfBuzz + libass) كـ Static
          cat << 'EOF' > "$CORE_DIR/scripts/build_libass.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          . "${SCRIPT_DIR}/depinfo.sh"

          PREFIX="${SCRIPT_DIR}/prefix"
          CROSS_FILE="${SCRIPT_DIR}/build/android_cross.txt"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"

          export CFLAGS_FOR_BUILD="-fno-lto"
          export LDFLAGS_FOR_BUILD="-fno-lto"

          # 5.1 بناء FreeType (Static)
          FT_SRC="${SCRIPT_DIR}/deps/freetype"
          [ -d "${FT_SRC}" ] || FT_SRC="${SCRIPT_DIR}/../deps/freetype"
          if [ ! -d "${FT_SRC}" ]; then
            echo "==> Cloning freetype..."
            git clone --depth 1 https://github.com/freetype/freetype.git "${FT_SRC}"
          fi
          FT_BUILD="${SCRIPT_DIR}/build/freetype"

          echo "==> Building FreeType (Static)..."
          rm -rf "${FT_BUILD}"
          meson setup "${FT_BUILD}" "${FT_SRC}" \
            --cross-file="${CROSS_FILE}" \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Doptimization=s \
            -Dauto_features=disabled
          ninja -C "${FT_BUILD}" -j$(nproc) install

          # 5.2 بناء FriBidi (Static)
          FB_SRC="${SCRIPT_DIR}/deps/fribidi"
          [ -d "${FB_SRC}" ] || FB_SRC="${SCRIPT_DIR}/../deps/fribidi"
          if [ ! -d "${FB_SRC}" ]; then
            echo "==> Cloning fribidi..."
            git clone --depth 1 https://github.com/fribidi/fribidi.git "${FB_SRC}"
          fi
          FB_BUILD="${SCRIPT_DIR}/build/fribidi"

          echo "==> Building FriBidi (Static)..."
          rm -rf "${FB_BUILD}"
          meson setup "${FB_BUILD}" "${FB_SRC}" \
            --cross-file="${CROSS_FILE}" \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Doptimization=s \
            -Dauto_features=disabled \
            -Ddocs=false \
            -Dtests=false
          ninja -C "${FB_BUILD}" -j$(nproc) install

          # 5.3 بناء HarfBuzz (Static - نظيف بدون افتراض أسماء ميزات)
          HB_SRC="${SCRIPT_DIR}/deps/harfbuzz"
          [ -d "${HB_SRC}" ] || HB_SRC="${SCRIPT_DIR}/../deps/harfbuzz"
          if [ ! -d "${HB_SRC}" ]; then
            echo "==> Cloning harfbuzz..."
            git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git "${HB_SRC}"
          fi
          HB_BUILD="${SCRIPT_DIR}/build/harfbuzz"

          echo "==> Building HarfBuzz (Static)..."
          rm -rf "${HB_BUILD}"
          meson setup "${HB_BUILD}" "${HB_SRC}" \
            --cross-file="${CROSS_FILE}" \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Doptimization=s \
            -Dauto_features=disabled \
            -Dfreetype=enabled
          ninja -C "${HB_BUILD}" -j$(nproc) install
          
          # 5.4 بناء libass (Static)
          ASS_SRC="${SCRIPT_DIR}/deps/libass"
          [ -d "${ASS_SRC}" ] || ASS_SRC="${SCRIPT_DIR}/../deps/libass"
          if [ ! -d "${ASS_SRC}" ]; then
            echo "==> Cloning libass..."
            git clone --depth 1 https://github.com/libass/libass.git "${ASS_SRC}"
          fi
          ASS_BUILD="${SCRIPT_DIR}/build/libass"

          echo "==> Building libass (Static)..."
          rm -rf "${ASS_BUILD}"
          meson setup "${ASS_BUILD}" "${ASS_SRC}" \
            --cross-file="${CROSS_FILE}" \
            --prefix="${PREFIX}" \
            --libdir=lib \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Doptimization=s \
            -Dauto_features=disabled \
            -Drequire-system-font-provider=false
          ninja -C "${ASS_BUILD}" -j$(nproc) install
          else
            cd "${ASS_SRC}"
            [ -f ./configure ] || ./autogen.sh
            mkdir -p "${ASS_BUILD}" && cd "${ASS_BUILD}"
            "${ASS_SRC}/configure" \
              --host="${TARGET}" \
              --prefix="${PREFIX}" \
              --libdir="${PREFIX}/lib" \
              --disable-shared \
              --enable-static \
              --disable-fontconfig \
              --disable-require-system-font-provider \
              CC="${NDK_LLVM}/bin/${TARGET}-clang" \
              CXX="${NDK_LLVM}/bin/${TARGET}-clang++" \
              AR="${NDK_LLVM}/bin/llvm-ar" \
              RANLIB="${NDK_LLVM}/bin/llvm-ranlib" \
              CFLAGS="-Os -flto -fPIC -I${PREFIX}/include" \
              LDFLAGS="-L${PREFIX}/lib" \
              PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig"
            make -j$(nproc)
            make install
          fi

          echo "==> Font & ASS stack installed successfully into prefix!"
          EOF
          
          # 6. سكربت بناء MPV المصغر
          cat << 'EOF' > "$CORE_DIR/scripts/build_mpv.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/mpv"
          CROSS_FILE="${SCRIPT_DIR}/build/android_cross.txt"
          MPV_SRC="${SCRIPT_DIR}/deps/mpv"
          [ -d "${MPV_SRC}" ] || MPV_SRC="${SCRIPT_DIR}/../deps/mpv"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}" "${PREFIX}"

          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_LIBDIR="${PREFIX}/lib/pkgconfig"

          MESON_ARGS=(
            "--cross-file=${CROSS_FILE}"
            "--prefix=${PREFIX}"
            "--libdir=lib"
            "--buildtype=release"
            "--default-library=shared"
            "-Doptimization=s"
            "-Db_lto=true"
            "-Dcplayer=false"
            "-Dlibmpv=true"
            "-Degl-android=enabled"
            "-Dlua=disabled"
            "-Djavascript=disabled"
            "-Dmanpage-build=disabled"
            "-Dhtml-build=disabled"
            "-Dtests=false"
          )

          echo "==> Configuring Minimal MPV with Meson..."
          meson setup "${BUILD_DIR}" "${MPV_SRC}" "${MESON_ARGS[@]}"

          echo "==> Compiling libmpv with Ninja..."
          ninja -C "${BUILD_DIR}" -j$(nproc)

          echo "==> Installing to prefix..."
          ninja -C "${BUILD_DIR}" install

          echo "==> MPV Build Complete! libmpv.so is ready in: ${PREFIX}/lib"
          EOF

          # 7. سكربت بناء جسر الأندرويد libplayer.so
          cat << 'EOF' > "$CORE_DIR/scripts/build_player.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          . "${SCRIPT_DIR}/depinfo.sh"

          PREFIX="${SCRIPT_DIR}/prefix"
          NDK_BIN="${NDK_LLVM}/bin"
          CXX="${NDK_BIN}/${TARGET}-clang++"

          JNI_DIR="${SCRIPT_DIR}/../../app/src/main/jni"

          echo "==> Compiling libplayer.so bridge..."
          mkdir -p "${PREFIX}/lib"

          JNI_FILES=$(find "${JNI_DIR}" -type f \( -name "*.cpp" -o -name "*.c" \))

          "${CXX}" -shared -fPIC \
            -Os -flto \
            -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -Wl,-s \
            -Wl,-z,max-page-size=16384 \
            -I"${PREFIX}/include" \
            -L"${PREFIX}/lib" \
            ${JNI_FILES} \
            -lmpv -landroid -llog -lOpenSLES -lEGL -lGLESv3 \
            -o "${PREFIX}/lib/libplayer.so"

          echo "==> libplayer.so built successfully in ${PREFIX}/lib!"
          EOF

          # 8. المنسق الرئيسي buildall.sh
          cat << 'EOF' > "$CORE_DIR/scripts/buildall.sh"
          #!/usr/bin/env bash
          set -euo pipefail

          export PATH="${HOME}/.local/bin:${PATH}"
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          . "${SCRIPT_DIR}/depinfo.sh"

          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build"

          echo "==> [1/8] Cleaning old build & prefix artifacts..."
          rm -rf "${BUILD_DIR}" "${PREFIX}"
          mkdir -p "${BUILD_DIR}" "${PREFIX}"

          echo "==> [2/8] Generating Shared Meson Cross File..."
          cat << CROSS_EOF > "${BUILD_DIR}/android_cross.txt"
          [binaries]
          c = '${NDK_LLVM}/bin/${TARGET}-clang'
          cpp = '${NDK_LLVM}/bin/${TARGET}-clang++'
          ar = '${NDK_LLVM}/bin/llvm-ar'
          strip = '${NDK_LLVM}/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = ['-Os', '-flto', '-fvisibility=hidden', '-I${PREFIX}/include']
          c_link_args = ['-Wl,--gc-sections', '-Wl,-s', '-flto', '-Wl,--icf=all', '-Wl,-z,max-page-size=16384', '-L${PREFIX}/lib']
          cpp_args = ['-Os', '-flto', '-fvisibility=hidden', '-I${PREFIX}/include']
          cpp_link_args = ['-Wl,--gc-sections', '-Wl,-s', '-flto', '-Wl,--icf=all', '-Wl,-z,max-page-size=16384', '-L${PREFIX}/lib']
          CROSS_EOF

          echo "==> [3/8] Building mbedtls (HTTPS backend)..."
          bash "${SCRIPT_DIR}/build_mbedtls.sh"

          echo "==> [4/8] Running FFmpeg Minimal Build..."
          export EXTRA_CFLAGS="-Os -flto -fvisibility=hidden -ffunction-sections -fdata-sections -fmerge-all-constants"
          export EXTRA_LDFLAGS="-Wl,--gc-sections -Wl,-s -flto -Wl,--icf=all -Wl,--pack-dyn-relocs=android+relr -Wl,--exclude-libs,ALL -Wl,-Bsymbolic-functions -Wl,--hash-style=gnu -Wl,-z,max-page-size=16384"
          bash "${SCRIPT_DIR}/build_minimal_ffmpeg.sh"

          echo "==> [5/8] Building libplacebo (Static)..."
          bash "${SCRIPT_DIR}/build_libplacebo.sh"

          echo "==> [6/8] Building libass & font stack (Static)..."
          bash "${SCRIPT_DIR}/build_libass.sh"

          echo "==> [7/8] Building MPV..."
          bash "${SCRIPT_DIR}/build_mpv.sh"

          echo "==> [8/8] Building libplayer.so (JNI Bridge)..."
          bash "${SCRIPT_DIR}/build_player.sh"

          echo "==> Post-Processing: Stripping .so binaries..."
          if command -v llvm-strip &> /dev/null; then
            find "${PREFIX}/lib" -name "*.so" -exec llvm-strip --strip-debug --strip-unneeded -R .comment {} + 2>/dev/null || true
          fi

          echo "==> Complete! Native Build Finished Successfully."
          EOF

          chmod +x "$CORE_DIR"/scripts/*.sh "$CORE_DIR"/*.sh

          # 9. تنزيل الاعتماديات وربط المسارات
          cd "$CORE_DIR"
          git config --global url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype.git"
          git config --global url."https://github.com/freetype/freetype.git".insteadOf "https://gitlab.freedesktop.org/freetype/freetype"
          find . -type f \( -name "*.sh" -o -name "*.cfg" \) -exec sed -i 's|https://gitlab.freedesktop.org/freetype/freetype.git|https://github.com/freetype/freetype.git|g' {} + 2>/dev/null || true

          ./download.sh
          find deps/ -name "meson.build" -exec sed -i "s/meson_version : '>= [0-9.]*'/meson_version : '>= 0.60.0'/g" {} + 2>/dev/null || true

          ln -sfn "$CORE_DIR/deps" "$CORE_DIR/scripts/deps"
          ln -sfn "$CORE_DIR/include" "$CORE_DIR/scripts/include" 2>/dev/null || true
          ln -sfn "$CORE_DIR/sdk" "$CORE_DIR/scripts/sdk" 2>/dev/null || true

          echo "==> Launching compilation process..."
          cd "$CORE_DIR/scripts"
          bash -x ./buildall.sh

      - name: Assemble Release AAR
        run: |
          set -euo pipefail
          cd mpv-core

          # 1. تحويل الموديول إلى Library وحذف خصائص التطبيق
          python3 - << 'EOF'
          import re

          def remove_block(text, block_name):
              match = re.search(r'\b' + block_name + r'\b[^{]*\{', text)
              if not match:
                  return text
              start = match.end() - 1
              idx = match.start()
              depth = 1
              i = start + 1
              while i < len(text) and depth > 0:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                  i += 1
              return text[:idx] + text[i:]

          gradle_file = 'app/build.gradle'
          with open(gradle_file, 'r') as f:
              content = f.read()

          content = content.replace("com.android.application", "com.android.library")
          content = re.sub(r'applicationId\s+.*', '', content)
          content = re.sub(r'shrinkResources\s+.*', '', content)
          content = re.sub(r'signingConfig\s+.*', '', content)

          for block in ['androidComponents', 'applicationVariants', 'signingConfigs', 'splits', 'bundle']:
              while re.search(r'\b' + block + r'\b[^{]*\{', content):
                  content = remove_block(content, block)

          custom_config = '''
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['src/main/jniLibs']
                  }
              }
              defaultConfig {
                  buildConfigField "String", "VERSION_NAME", "\\"1.0.0\\""
                  buildConfigField "int", "VERSION_CODE", "1"
                  ndk {
                      abiFilters "arm64-v8a"
                  }
              }
          '''
          content = re.sub(r'(android\s*\{)', r'\1' + custom_config, content, count=1)

          with open(gradle_file, 'w') as f:
              f.write(content)

          manifest_file = 'app/src/main/AndroidManifest.xml'
          with open(manifest_file, 'r') as f:
              manifest = f.read()

          manifest = manifest.replace('<category android:name="android.intent.category.LAUNCHER" />', '')
          manifest = manifest.replace('<category android:name="android.intent.category.LAUNCHER"/>', '')
          manifest = re.sub(r'android:icon="[^"]*"', '', manifest)
          manifest = re.sub(r'android:roundIcon="[^"]*"', '', manifest)
          manifest = re.sub(r'android:label="[^"]*"', '', manifest)
          manifest = re.sub(r'android:theme="[^"]*"', '', manifest)

          with open(manifest_file, 'w') as f:
              f.write(manifest)
          EOF

          # 2. تعديل AboutActivity.kt
          ABOUT_FILE=$(find app/src/main/ -name "AboutActivity.kt" | head -n 1)
          if [ -n "$ABOUT_FILE" ] && [ -f "$ABOUT_FILE" ]; then
            sed -i '/import.*VERSION_NAME/d' "$ABOUT_FILE"
            sed -i '/import.*VERSION_CODE/d' "$ABOUT_FILE"
            sed -i 's/BuildConfig\.VERSION_NAME/"1.0.0"/g' "$ABOUT_FILE"
            sed -i 's/BuildConfig\.VERSION_CODE/1/g' "$ABOUT_FILE"
            sed -i 's/\bVERSION_NAME\b/"1.0.0"/g' "$ABOUT_FILE"
            sed -i 's/\bVERSION_CODE\b/1/g' "$ABOUT_FILE"
          fi

          # 3. جلب ملفات .so الصافية فقط وفك الروابط الرمزية
          rm -rf app/src/main/jniLibs app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a

          echo "==> Packaging native libraries into jniLibs..."
          find buildscripts/scripts/prefix/lib/ -maxdepth 1 -name "*.so" -exec cp -v -aL {} app/src/main/jniLibs/arm64-v8a/ \;

          # تجريد نهائي شامل للرموز
          find app/src/main/jniLibs/arm64-v8a/ -name "*.so" -exec "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all -R .comment -R .note {} + 2>/dev/null || true

          echo "==> Packaged native libraries list:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

          # 4. بناء الـ AAR عبر Gradle
          chmod +x gradlew
          ./gradlew :app:assembleDefaultRelease -x lint -x test --no-daemon

          # 5. استخراج الـ AAR والتحقق من احتوائه على المكتبات
          mkdir -p ../dist
          find app/build/outputs/aar/ -type f -name "*.aar" -exec cp -v {} ../dist/mpv-android.aar \;

          echo "==> Verifying AAR Contents:"
          unzip -l ../dist/mpv-android.aar | grep -E '\.so$'

          echo "==> Final Minimal AAR Size:"
          ls -lh ../dist/

      - name: Upload Minimal MPV AAR
        uses: actions/upload-artifact@v4
        with:
          name: mpv-android-minimal-aar
          path: dist/mpv-android.aar
          if-no-files-found: error
