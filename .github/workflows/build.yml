name: Build MPV Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3 \
            python3-jinja2

      - name: Setup Environment & Toolchain
        run: |
          set -euo pipefail
          RUNNER_SDK="$ANDROID_SDK_ROOT"
          cd buildscripts
          chmod +x *.sh include/*.sh 2>/dev/null || true

          # 1. إعداد مسار SDK
          mkdir -p sdk
          ln -sfn "$RUNNER_SDK" sdk/android-sdk-linux

          # 2. أداة gas-preprocessor
          mkdir -p sdk/bin
          if [ ! -f sdk/bin/gas-preprocessor.pl ]; then
            wget -q https://github.com/FFmpeg/gas-preprocessor/raw/master/gas-preprocessor.pl -O sdk/bin/gas-preprocessor.pl
            chmod +x sdk/bin/gas-preprocessor.pl
          fi

          # 3. تثبيت NDK r30 وضبط المسار
          if [ ! -d "sdk/android-ndk-r30" ]; then
            echo "==> Downloading NDK r30..."
            wget -q --progress=bar:force "http://dl.google.com/android/repository/android-ndk-r30-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          NDK_PATH=$(find "$PWD/sdk" -maxdepth 1 -type d -name "android-ndk-*" | head -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

          # 4. تنزيل سورس mpv والاعتماديات
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          mkdir -p deps
          cd deps

          if [ ! -d ffmpeg ]; then
            echo "==> Cloning ffmpeg..."
            git clone --depth 1 -b n9.0 https://github.com/FFmpeg/FFmpeg ffmpeg
          fi

          if [ ! -d freetype ]; then
            echo "==> Fetching freetype..."
            wget -qO- https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz | tar -xJ -C .
            mv freetype-2.13.3 freetype
          fi

          if [ ! -d fribidi ]; then
            echo "==> Fetching fribidi..."
            wget -qO- https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz | tar -xJ -C .
            mv fribidi-1.0.16 fribidi
          fi

          if [ ! -d harfbuzz ]; then
            echo "==> Cloning harfbuzz..."
            git clone --depth 1 -b 9.0.0 https://github.com/harfbuzz/harfbuzz.git harfbuzz
          fi

          if [ ! -d libass ]; then
            echo "==> Fetching libass..."
            wget -qO- https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz | tar -xJ -C .
            mv libass-0.17.3 libass
          fi

          if [ ! -d libplacebo ]; then
            echo "==> Cloning libplacebo..."
            git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git libplacebo
          fi

      - name: Compile MPV & Dependencies Arm64
        run: |
          set -euo pipefail
          cd buildscripts

          rm -rf build prefix
          mkdir -p build prefix

          CROSS_FILE="$PWD/build/android_cross.txt"
          NDK_LLVM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET="aarch64-linux-android24"

          cat << CROSS_EOF > "${CROSS_FILE}"
          [binaries]
          c = '${NDK_LLVM}/${TARGET}-clang'
          cpp = '${NDK_LLVM}/${TARGET}-clang++'
          ar = '${NDK_LLVM}/llvm-ar'
          strip = '${NDK_LLVM}/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = ['-Os', '-flto', '-fvisibility=hidden', '-I$PWD/prefix/include']
          c_link_args = ['-Wl,--gc-sections', '-Wl,-s', '-flto', '-Wl,--icf=all', '-L$PWD/prefix/lib', '-static-libstdc++']
          CROSS_EOF

          export PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_LIBDIR="$PWD/prefix/lib/pkgconfig"
          export EXTRA_CFLAGS="-Os -flto -fvisibility=hidden -ffunction-sections -fdata-sections -fmerge-all-constants"
          export EXTRA_LDFLAGS="-Wl,--gc-sections -Wl,-s -flto -Wl,--icf=all -Wl,--pack-dyn-relocs=android+relr -Wl,--exclude-libs,ALL -Wl,-Bsymbolic-functions -Wl,--hash-style=gnu -Wl,-z,max-page-size=16384"

          # 1. بناء FFmpeg
          echo "==> [1/7] Building Minimal FFmpeg..."
          cat << 'EOF' > build_minimal_ffmpeg.sh
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          PREFIX="${SCRIPT_DIR}/prefix"
          BUILD_DIR="${SCRIPT_DIR}/build/ffmpeg"
          FFMPEG_SRC="${SCRIPT_DIR}/deps/ffmpeg"

          mkdir -p "${BUILD_DIR}" "${PREFIX}"
          cd "${BUILD_DIR}"

          SAFE_CFLAGS="${EXTRA_CFLAGS:-} -I${PREFIX}/include -fvisibility=default"

          FFMPEG_MINIMAL_FLAGS=(
            --target-os=android
            --arch=aarch64
            --cpu=armv8-a
            --enable-cross-compile
            --cc=aarch64-linux-android24-clang
            --cxx=aarch64-linux-android24-clang++
            --ar=llvm-ar
            --ranlib=llvm-ranlib
            --nm=llvm-nm
            --strip=llvm-strip
            --prefix="${PREFIX}"
            --disable-static
            --enable-shared
            --disable-everything
            --disable-doc
            --disable-programs
            --disable-encoders
            --disable-muxers
            --disable-devices
            --disable-filters
            --disable-iconv
            --disable-bzlib
            --disable-lzma
            --disable-xlib
            --enable-swscale
            --enable-jni
            --enable-mediacodec
            --disable-hwaccels
            --enable-hwaccel=h264_mediacodec
            --enable-hwaccel=hevc_mediacodec
            --enable-hwaccel=vp9_mediacodec
            --enable-hwaccel=av1_mediacodec
            --enable-decoder=h264,hevc,vp8,vp9,mpeg4,aac,mp3
            --enable-parser=h264,hevc,av1,vp9,aac,mpegaudio
            --enable-demuxer=mov,matroska,flv,hls,dash,aac,mp3,mpegts
            --enable-protocol=file,http,https,tcp,udp,hls,tls
          )

          "${FFMPEG_SRC}/configure" "${FFMPEG_MINIMAL_FLAGS[@]}" \
            --extra-cflags="${SAFE_CFLAGS}" \
            --extra-ldflags="${EXTRA_LDFLAGS:-} -L${PREFIX}/lib"

          make -j$(nproc)
          make install
          EOF
          bash ./build_minimal_ffmpeg.sh

          # 2. بناء FreeType
          echo "==> [2/7] Building FreeType..."
          meson setup "build/freetype" "deps/freetype" \
            --cross-file="${CROSS_FILE}" \
            --prefix="$PWD/prefix" \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Dauto_features=disabled \
            -Dharfbuzz=disabled \
            -Dbrotli=disabled \
            -Dbzip2=disabled \
            -Dpng=disabled \
            -Dzlib=disabled
          ninja -C "build/freetype" -j$(nproc) install

          # 3. بناء FriBidi
          echo "==> [3/7] Building FriBidi..."
          meson setup "build/fribidi" "deps/fribidi" \
            --cross-file="${CROSS_FILE}" \
            --prefix="$PWD/prefix" \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Dauto_features=disabled \
            -Ddocs=false \
            -Dtests=false
          ninja -C "build/fribidi" -j$(nproc) install

          # 4. بناء HarfBuzz الصافي
          echo "==> [4/7] Building HarfBuzz..."
          meson setup "build/harfbuzz" "deps/harfbuzz" \
            --cross-file="${CROSS_FILE}" \
            --prefix="$PWD/prefix" \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Dauto_features=disabled \
            -Dtests=disabled
          ninja -C "build/harfbuzz" -j$(nproc) install

          # 5. بناء libass
          echo "==> [5/7] Building libass..."
          meson setup "build/libass" "deps/libass" \
            --cross-file="${CROSS_FILE}" \
            --prefix="$PWD/prefix" \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Dauto_features=disabled
          ninja -C "build/libass" -j$(nproc) install

          # 6. بناء libplacebo
          echo "==> [6/7] Building libplacebo..."
          meson setup "build/libplacebo" "deps/libplacebo" \
            --cross-file="${CROSS_FILE}" \
            --prefix="$PWD/prefix" \
            --buildtype=release \
            --default-library=static \
            -Db_staticpic=true \
            -Dauto_features=disabled \
            -Ddemos=false
          ninja -C "build/libplacebo" -j$(nproc) install

          # 7. بناء MPV النهائي لإنتاج libmpv.so
          echo "==> [7/7] Building Ultra-Minimal MPV..."
          MESON_ARGS=(
            "--cross-file=${CROSS_FILE}"
            "--prefix=$PWD/prefix"
            "--buildtype=release"
            "--default-library=shared"
            "-Db_lto=true"
            "-Dauto_features=disabled"
            "-Dlibmpv=true"
            "-Dcplayer=false"
            "-Degl-android=enabled"
          )
          meson setup "build/mpv" "deps/mpv" "${MESON_ARGS[@]}"
          ninja -C "build/mpv" -j$(nproc) install

          echo "==> Stripping SO files..."
          if command -v llvm-strip &> /dev/null; then
            find prefix/ -name "*.so" -exec llvm-strip --strip-debug --strip-unneeded -R .comment {} + 2>/dev/null || true
          fi

      - name: Collect Libraries
        run: |
          mkdir -p dist

          find buildscripts/prefix/ -type f -name "*.so*" -exec cp -v {} dist/ \; 2>/dev/null || true
          find app/ -type f -name "*.so*" -exec cp -v {} dist/ \; 2>/dev/null || true

          echo "==> Final arm64-v8a Binaries:"
          ls -lh dist/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64
          path: dist/
          if-no-files-found: error
