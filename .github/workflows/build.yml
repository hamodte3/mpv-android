name: Build MPV Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            meson \
            autoconf \
            automake \
            libtool \
            pkg-config \
            clang \
            llvm \
            yasm \
            nasm \
            python3

      - name: Setup and Download Dependencies
        run: |
          set -euo pipefail
          RUNNER_SDK="$ANDROID_SDK_ROOT"
          cd buildscripts
          chmod +x buildall.sh include/*.sh

          # 1. إعداد مسار SDK
          mkdir -p sdk
          ln -sfn "$RUNNER_SDK" sdk/android-sdk-linux

          # 2. أداة gas-preprocessor
          mkdir -p sdk/bin
          if [ ! -f sdk/bin/gas-preprocessor.pl ]; then
            wget -q https://github.com/FFmpeg/gas-preprocessor/raw/master/gas-preprocessor.pl -O sdk/bin/gas-preprocessor.pl
            chmod +x sdk/bin/gas-preprocessor.pl
          fi

          # 3. فك NDK r30
          if [ ! -d "sdk/android-ndk-r30" ]; then
            echo "==> Downloading NDK r30"
            wget -q --progress=bar:force "http://dl.google.com/android/repository/android-ndk-r30-linux.zip" -O ndk.zip
            unzip -q ndk.zip -d sdk/
            rm ndk.zip
          fi

          # 4. سورس MPV
          mkdir -p deps/mpv
          wget -qO- https://github.com/mpv-player/mpv/archive/master.tar.gz | tar -xz -C deps/mpv --strip-components=1

          # 5. تنزيل الاعتماديات الصافية بأوامر مباشرة دون أي سكربت خارجي
          mkdir -p deps
          cd deps

          if [ ! -d mbedtls ]; then
            echo "==> Fetching mbedtls"
            wget -qO- https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2 | tar -xj -C .
            mv mbedtls-3.6.7 mbedtls
          fi

          if [ ! -d ffmpeg ]; then
            echo "==> Cloning ffmpeg"
            git clone --depth 1 -b n9.0 https://github.com/FFmpeg/FFmpeg ffmpeg
          fi

          if [ ! -d libplacebo ]; then
            echo "==> Cloning libplacebo"
            git clone --depth 1 --recursive https://code.videolan.org/videolan/libplacebo.git libplacebo
          fi

          if [ ! -d curl ]; then
            echo "==> Fetching curl"
            wget -qO- https://curl.se/download/curl-8.21.0.tar.xz | tar -xJ -C .
            mv curl-8.21.0 curl
          fi

      - name: Build MPV Arm64
        run: |
          set -euo pipefail
          cd buildscripts
          ./buildall.sh --only-deps mpv --arch arm64
          ./buildall.sh -n mpv --arch arm64
          ./buildall.sh -n --arch arm64

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64
          path: |
            app/src/main/libs/arm64-v8a/*.so
            buildscripts/prefix/arm64/lib/libmpv.so
          if-no-files-found: warn
